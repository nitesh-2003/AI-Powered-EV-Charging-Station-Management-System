# =============================================================================
# docker-compose.yml - AI-Powered EV Charging Station Management System
#
# Services:
#   db  – PostgreSQL 16 (Alpine) with persistent storage and healthcheck
#   api – FastAPI application built from the project Dockerfile
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f api    # tail API logs
#   docker compose down -v        # stop & remove volumes (data reset)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ev_charging_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ev_charging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # FastAPI Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database – uses the Docker-internal hostname "db"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ev_charging_db}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ev_charging_db}

      # Application settings
      PROJECT_NAME: ${PROJECT_NAME:-AI-Powered EV Charging Station Management System}
      VERSION: ${VERSION:-1.0.0}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-secret-key-change-this-for-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      # CORS
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:8000","http://localhost:8000"]}

      # Optional – Generative AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ml_models:/home/appuser/app/ml_models
      - ml_data:/home/appuser/app/ml_data

# =============================================================================
# Named volumes for data persistence across container restarts
# =============================================================================
volumes:
  postgres_data:
    driver: local
  ml_models:
    driver: local
  ml_data:
    driver: local
